name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-latest
    env:
      PYTHONPATH: backend/src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: PowerShell script syntax check
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\scripts\windows\*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $_.FullName), [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Error "$($_.FullName) has PowerShell syntax errors: $errors"
            }
          }
          if ($failed) { exit 1 }

      - name: Backend Windows smoke tests
        run: >
          python -m pytest
          backend/tests/unit/test_hardware_config.py
          backend/tests/unit/test_camera_lazy_import.py
          backend/tests/unit/test_source_provenance.py
          backend/tests/unit/test_serial_ports.py
          backend/tests/unit/test_windows_runtime_assets.py
          backend/tests/integration/test_camera_api.py::test_operator_source_status_reports_real_hardware_config
          backend/tests/integration/test_camera_api.py::test_operator_source_status_reports_missing_windows_sdk
          backend/tests/integration/test_camera_api.py::test_operator_real_camera_run_rejects_simulated_backend
          backend/tests/integration/test_camera_api.py::test_operator_real_camera_run_rejects_simulated_temperature
          backend/tests/integration/test_camera_api.py::test_temperature_ports_alias_returns_discovered_windows_com_ports
          backend/tests/integration/test_camera_api.py::test_temperature_status_endpoint_reports_missing_selected_com_port
          -q

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build
