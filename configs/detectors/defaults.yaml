    envelope_window_px: null
    envelope_step_px: null
    min_window_pixels: 50
    window_width_keep_ratio: 0.45
    window_count_keep_ratio: 0.35
    debug_contour_close_kernel_px: 21
    debug_contour_smooth_window_px: 7
    tie_width_epsilon_px: 2.0
    switch_after_n_frames: 3
    jump_limit_px: 25.0
    min_confidence: 0.5
